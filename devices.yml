########################################################################
# Basic anchors                                                        #
########################################################################

.devtools_packages:
  packages: &devtools_packages
    - droidian-devtools
    - adaptation-hybris-devtools

.adaptation_generic_packages:
  packages: &adaptation_generic_packages
    - adaptation-android-generic

########################################################################
# Recovery-flashable rootfses                                          #
########################################################################

rootfs_phosh:
  type: rootfs
  arch: [arm64]
  edition: phosh
  variant: phone
  apilevel: [30]

  packages: *adaptation_generic_packages

  bundles:
    # Developer tools bundle
    - name: droidian-devtools
      arch: any
      apilevel: any
      only_stable: yes
      packages: *devtools_packages

rootfs_gsi_base:
  type: rootfs
  arch: [arm64]
  edition: gsi_base
  variant: phone
  apilevel: [30]

  packages: *adaptation_generic_packages

  bundles:
    # Developer tools bundle
    - name: droidian-devtools
      arch: any
      apilevel: any
      only_stable: yes
      packages: *devtools_packages

########################################################################
# Recovery-flashable images                                          #
########################################################################

image_phosh:
  type: image
  arch: [arm64]
  edition: phosh
  variant: phone
  apilevel: [30]

  packages: *adaptation_generic_packages

  bundles:
    # Developer tools bundle
    - name: droidian-devtools
      arch: any
      apilevel: any
      only_stable: yes
      packages: *devtools_packages

image_gsi_base:
  type: image
  arch: [arm64]
  edition: gsi_base
  variant: phone
  apilevel: [30]

  packages: *adaptation_generic_packages

  bundles:
    # Developer tools bundle
    - name: droidian-devtools
      arch: any
      apilevel: any
      only_stable: yes
      packages: *devtools_packages

